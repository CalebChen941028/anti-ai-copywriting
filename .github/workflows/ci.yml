name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Unit & Regression Tests
        run: |
          python3 -m unittest discover -s tests

      - name: Test CLI Direct Invocation
        run: |
          PYTHONPATH=lint python3 -m anti_ai_lint tests/fixtures/academic/paper.after.md --max-score 5.0
          PYTHONPATH=lint python3 -m anti_ai_lint --format json tests/fixtures/en_academic/paper.after.md
